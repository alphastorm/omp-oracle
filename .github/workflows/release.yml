name: release

# A pushed vX.Y.Z tag publishes that commit to npm through trusted publishing (OIDC): no npm token
# exists, and npm attaches a provenance attestation for the run. The release proof (live ChatGPT
# presets, Crabbox matrix) cannot run here; it passes locally before the tag is pushed. See
# docs/RELEASE.md#publishing.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pushed commit, even if the tag moves while the run waits.
          ref: ${{ github.sha }}
          persist-credentials: false
      # No dependency cache in a release build: a poisoned cache entry would be published.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check the tag names the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not name package.json version $version"
            exit 1
          fi
      - name: Install archive tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run the local gate
        run: npm run verify:oracle
      - name: Pack
        run: mkdir -p "$RUNNER_TEMP/package" && npm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  # The only job that can mint the npm credential, so it runs no repository or dependency code:
  # no checkout and no install, only the tarball the verify job packed.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      # Publishing a tarball runs no lifecycle scripts, so prepublishOnly's local-only
      # release:check does not run here.
      - name: Publish to npm
        run: npm publish "./package/omp-oracle-${GITHUB_REF_NAME#v}.tgz"
