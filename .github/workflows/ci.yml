name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-gate:
    # The everyday local gate. Tags run release.yml, which repeats this gate before publishing;
    # the release proof (live ChatGPT presets, Crabbox matrix) stays local. See docs/RELEASE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install archive tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run the local gate
        run: npm run verify:oracle
