name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  local-gate:
    # The everyday local gate only. Release proof (live ChatGPT presets, Crabbox matrix) stays
    # local by design; see docs/RELEASE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install archive tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run the local gate
        run: npm run verify:oracle
